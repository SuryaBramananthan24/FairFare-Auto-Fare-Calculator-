<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <style>
	    body {
            background-color: #fdd835; /* Taxi Yellow */
            font-family: Arial, sans-serif;
        }
        #container {
            width: 400px;
            margin: auto;
            text-align: center;
        }
		#submit-btn {
            width: 50%;
            padding: 10px;
            margin: 5px 0;
			position:relative;
			left: -25px;
        }
        
        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input{
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        #c {
            width: 100%;
            padding: 10px;
            background-color: #006064; /* Petrol Blue */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #c:hover {
            background-color: #004d40;
        }
        .options {
            text-align: center;
            margin-top: 10px;
        }
        a {
            color: #006064;
            text-decoration: none;
            
            margin: 5px 0;
        }
        .or {
            text-align: center;
            margin: 10px 0;
            color: #555;
        }
    </style>
</head>
<body><br><br><br><br>
       <h2>Auto Fee Calculator</h2>
       <div class="login-container">
        <h2>Payment</h2>
        <form action="/p">
		<h3 id='f'></h3>
		<div id="d">
            <input type="text" name="upi" id ="dup" placeholder="Driver UPI Id" patttern="^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$"required>
        </div><br>
			<button type="submit" id='c'>Pay</button>
		</form>
<script>
	let fare = localStorage.getItem('fare');
	let from = localStorage.getItem('from');
	let to = localStorage.getItem('to');
	let distance = localStorage.getItem('distance');
	let duration = localStorage.getItem('duration');
	fare = Math.round(fare);
	console.log(fare);
	document.getElementById('f').innerHTML = `<center><strong>₹: ${fare}</strong></center>`;
	const user = {
		From : from ,
		To  : to,
		Distance : distance,
		Fare : fare,
	};
	let c = document.getElementById('c');
	c.onclick = ()=>{
		localStorage.setItem('user',JSON.stringify(user));
		let dup = document.getElementById('dup').value;
		console.log(dup);
		event.preventDefault();
		document.getElementById('d').innerHTML = '<center><h3>Payment Successful</h3></center>';
		c.innerHTML = 'Payment Details';
		localStorage.setItem('from',from);
		localStorage.setItem('to',to);
		localStorage.setItem('fare',fare);
		localStorage.setItem('distance',distance);
		localStorage.setItem('duration',duration);
		localStorage.setItem('dup',dup);
		c.onclick = function() { 
			event.preventDefault();
			const data = { Fare : fare, UPIId : dup};
			fetch('/p',{
				method : 'POST',
				headers: {'Content-Type': 'application/json'},
				body : JSON.stringify(data)
			})
			.then(response =>{if(response.ok){console.log(response.text());} else{console.log("Error");}})
			.then(result=>{console.log("Data send to server"); })
			.catch(err =>{console.error(err);});
		     window.location.href = '/pd';
		}
	}
</script>

</body>
</html>

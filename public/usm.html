<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Fee Calculator</title>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-core.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-service.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-marker.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://js.api.here.com/v3/3.1/mapsjs-ui.js" type="text/javascript" charset="utf-8"></script>
    <style>
        body {
            background-color: #fdd835; /* Taxi Yellow */
            font-family: Arial, sans-serif;
        }
        #map {
            height: 400px;
            width: 100%;
        }
        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
		#sd {
			width:100%;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="text"] {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #006064; /* Petrol Blue */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004d40;
        }
        .checkbox-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Auto-Fee</h2>
        <input type="text" id="from" placeholder="From..." required>
        <input type="text" id="to" placeholder="To..." required>
        <div class="checkbox-container">
            <label><input type="checkbox" id="rainy"> Rainy</label>
            <label><input type="checkbox" id="traffic"> Traffic</label>
        </div>
		<div id="sd"></div>
        <button id="c">Calculate</button><br><br>
        <div id="map"></div>
    </div>


    <script type="text/javascript">
        
        document.addEventListener('DOMContentLoaded', function () {
            var platform = new H.service.Platform({
                apikey: 'qtKVSEmtQ4FwMlDQtmHc9ixw5nfRLivVYAvBzLoPz8A' 
            });

            const defaultLayers = platform.createDefaultLayers();
            const mapContainer = document.getElementById('map');
            const routeInstructionsContainer = document.getElementById('sd');
            const map = new H.Map(mapContainer, defaultLayers.vector.normal.map, {
                center: { lat: 9.9252, lng: 78.1198 },
                zoom: 5,
                pixelRatio: window.devicePixelRatio || 1
            });

            const behavior = new H.mapevents.Behavior(new H.mapevents.MapEvents(map));
            const ui = H.ui.UI.createDefault(map, defaultLayers);
            const geocoder = platform.getSearchService();

            function geocodePlaceName(place, callback) {
                geocoder.geocode(
                    { q: place },
                    (result) => {
                        const location = result.items[0].position;
                        callback(location);
                    },
                    (error) => alert('Error during geocoding')
                );
            }

            function addMarkerToMap(position, label) {
                const marker = new H.map.Marker(position);
                map.addObject(marker);
                openBubble(position, label);
            }

            function calculateRouteFromAtoB(platform, origin, destination) {
                const router = platform.getRoutingService(null, 8);
                const routeRequestParams = {
                    routingMode: 'fast',
                    transportMode: 'car',
                    origin: `${origin.lat},${origin.lng}`,
                    destination: `${destination.lat},${destination.lng}`,
                    return: 'polyline,turnByTurnActions,actions,instructions,travelSummary'
                };

                router.calculateRoute(routeRequestParams, onSuccess, onError);
            }

            function onSuccess(result) {
                const route = result.routes[0];
                addRouteShapeToMap(route);
                addManueversToMap(route);
                addSummaryToPanel(route);
                calculateFare(route);
            }

            function onError(error) {
                alert("Can't reach the remote server");
            }

            function addRouteShapeToMap(route) {
                route.sections.forEach((section) => {
                    const linestring = H.geo.LineString.fromFlexiblePolyline(section.polyline);
                    const polyline = new H.map.Polyline(linestring, {
                        style: { lineWidth: 4, strokeColor: 'rgba(0, 128, 255, 0.7)' }
                    });
                    map.addObject(polyline);
                    map.getViewModel().setLookAtData({ bounds: polyline.getBoundingBox() });
                });
            }

            function addManueversToMap(route) {
                const dotIcon = new H.map.Icon('<svg width="18" height="18" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="8" fill="#1b468d" stroke="white" stroke-width="1" /></svg>', { anchor: { x: 8, y: 8 } });
                const group = new H.map.Group();

                route.sections.forEach((section) => {
                    const poly = H.geo.LineString.fromFlexiblePolyline(section.polyline).getLatLngAltArray();
                    const actions = section.actions;

                    actions.forEach((action) => {
                        const marker = new H.map.Marker(
                            { lat: poly[action.offset * 3], lng: poly[action.offset * 3 + 1] },
                            { icon: dotIcon }
                        );
                        marker.instruction = action.instruction;
                        group.addObject(marker);
                    });

                    group.addEventListener('tap', (evt) => {
                        map.setCenter(evt.target.getGeometry());
                        openBubble(evt.target.getGeometry(), evt.target.instruction);
                    });
                    map.addObject(group);
                });
            }

            let bubble;
            function openBubble(position, text) {
                if (!bubble) {
                    bubble = new H.ui.InfoBubble(position, { content: text });
                    ui.addBubble(bubble);
                } else {
                    bubble.setPosition(position);
                    bubble.setContent(text);
                    bubble.open();
                }
            }

            function addSummaryToPanel(route) {
                let distance = 0;
                let duration = 0;

                route.sections.forEach((section) => {
                    distance += section.travelSummary.length;
                    duration += section.travelSummary.duration;
                });
				localStorage.setItem('distance',distance);
				localStorage.setItem('duration',duration);
                const summaryDiv = document.createElement('div');
                summaryDiv.innerHTML = `<h5>Total distance : ${(distance / 1000).toFixed(2)} km.</h5><h5>Travel Time : ${Math.floor(duration / 60)} minutes ${duration % 60} seconds.</h5>`;
                summaryDiv.style.fontSize = 'small';
                summaryDiv.style.marginLeft = '5%';
                summaryDiv.style.marginRight = '5%';

                if (routeInstructionsContainer) {
                    routeInstructionsContainer.appendChild(summaryDiv);
                } else {
                    console.warn("Element with ID 'sd' not found.");
                }
            }

            function calculateFare(route) {
                let distance = 0;

                route.sections.forEach((section) => {
                    distance += section.travelSummary.length;
                });

                const distanceKm = distance / 1000;
                const farePerKm = 8.75; 
                const fare = (distanceKm * farePerKm) + 30;
			    localStorage.setItem('fare',fare);
				const fareDiv = document.createElement('div');
                fareDiv.innerHTML = `<h5>Estimated Fare: ₹${fare.toFixed(2)}</h5>`;
                fareDiv.style.fontSize = 'small';
                fareDiv.style.marginLeft = '5%';
                fareDiv.style.marginRight = '5%';
				let c = document.getElementById('c');
				c.innerHTML = 'Pay';
                if (routeInstructionsContainer) {
                    routeInstructionsContainer.appendChild(fareDiv);
					//routeInstructionsContainer.appendChild(btn);
                } else {
                    console.warn("Element with ID 'sd' not found.");
                }
				c.onclick = function() {
					const data = {
						from: localStorage.getItem('from'),
						to: localStorage.getItem('to'),
						Distance: distanceKm,
						Duration: localStorage.getItem('duration'),
					    Fare: fare,
					};
					fetch('/usm',{
						method : 'POST',
						headers:{'Content-Type' : 'application/json'},
						body:JSON.stringify(data)
					})
					 .then(response =>{if(response.ok){return response.text();} else{console.log('Error sending Data');}})
					 .then(result=>{console.log("Data send to server"); window.location.href = '/p';;})
					 .catch(err =>{console.log(err);});				
				};
            }
		    document.getElementById('c').onclick = function() {
				event.preventDefault();
                const originPlace = document.getElementById('from').value;
                const destinationPlace = document.getElementById('to').value;
				localStorage.setItem('from',originPlace);
				localStorage.setItem('to',destinationPlace);
                geocodePlaceName(originPlace, (origin) => {
                    geocodePlaceName(destinationPlace, (destination) => {
                        addMarkerToMap(origin, 'Origin');
                        addMarkerToMap(destination, 'Destination');
                        calculateRouteFromAtoB(platform, origin, destination);
                    });
                });
            };
        });
    </script>
</body>
</html>

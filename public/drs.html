.-<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver SignUp</title>
    <style>
        body {
            background-color: #fdd835; /* Taxi Yellow */
            font-family: Arial, sans-serif;
        }
        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: inline-block;
            width: 70px;
            margin-top: 10px;
            color: #333;
  *-      }
        input[type="text"],input[type="number"], input[type="email"], input[type="password"], input[type="phone"], input[type="auto"] {


            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #006064; 
			
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #004d40;
        }
        .options {
            text-align: center;
            margin-top: 10px;
        }
        a {
            color: #006064;
            text-decoration: none;
            margin: 5px 0;
        }
        .or {
            text-align: center;
            margin: 10px 0;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Driver SignUp</h2>
        <form action="/drs" method="POST">
            <label>Email:</label>
            <input type="email" name="email">
			<label>Phone No:</label>
            <input type="number" name="phoneno" required>
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <label>Auto No:</label>
            <input type="text" name="autono" required>
            <br><br>
            <input type="submit" value="Sign Up" >
        </form>
      
        <div class="or">or</div> 
      
        <div class="options">
            <a href="/usl">Login as User</a>&nbsp;&nbsp; <a href="/drl">Login as Driver</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
	    body {
            background-color: #fdd835; /* Taxi Yellow */
            font-family: Arial, sans-serif;
        }
        #container {
            width: 400px;
            margin: auto;
            text-align: center;
        }
		#submit-btn {
            width: 50%;
            padding: 10px;
            margin: 5px 0;
			position:relative;
			left: -25px;
        }
        #mapContainer {
            height: 400px;
            width: 100%;
        }
		
        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 93%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #006064; /* Petrol Blue */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #004d40;
        }
        .options {
            text-align: center;
            margin-top: 10px;
        }
        a {
            color: #006064;
            text-decoration: none;
            margin: 5px 0;
        }
        .or {
            text-align: center;
            margin: 10px 0;
            color: #555;
        }
    </style>
</head>
<body><br><br>
       <h2>Auto Fee Calculator</h2>
       <div class="login-container"> 
       <h2>User Login</h2>
        <form action="/usl" method="POST">
            <input type="email" name="email" placeholder="Email" id="email" required>
            <input type="password" name="password" placeholder="Password" id="password" required><br><br>
            <input type="submit" value="Login">
        </form>
        <div class="or">or</div>
        <center>
        <h3>New One?</h3>
        <a href="/uss">Sign Up as User</a> &nbsp&nbsp&nbsp&nbsp <a href="/drs">Sign Up as Driver</a>
        </center>  
		<div class="options">
            <a href="/drl">Login as Driver</a>
        </div>
		</div>
</body>
</html>
